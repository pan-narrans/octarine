[package]
name = "octarine"
version = "0.1.0"
edition = "2021"
description = "Octarine Core Backend Caching & Synchronization Engine"

[lib]
name = "octarine"
path = "src/lib.rs"

[[bin]]
name = "octarine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
pulldown-cmark = "0.11"
notify = "6.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
tauri = { version = "1.6", features = ["api-all"] }

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[features]
default = []
