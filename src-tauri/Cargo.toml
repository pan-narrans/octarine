[package]
name = "octarine"
version = "0.1.0"
edition = "2021"
description = "Octarine Core Backend Caching & Synchronization Engine"
license = "MIT"
repository = "https://github.com/pan-narrans/octarine"

[lib]
name = "octarine"
path = "src/lib.rs"

[[bin]]
name = "octarine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pulldown-cmark = "0.13"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sha2 = "0.11"
hex = "0.4"
ignore = "0.4"
open = "5.4"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tempfile = "3.10"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
unicode-normalization = "0.1"
unicase = "2.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
