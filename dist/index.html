<!DOCTYPE html>
<html>
  <head>
    <title>Octarine Dashboard</title>
    <style>
      body {
        background-color: #0b111e;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      .container {
        text-align: center;
        animation: fadeIn 1.2s ease-out;
      }
      h1 {
        font-size: 3.5rem;
        background: linear-gradient(135deg, #c084fc, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.05em;
      }
      .tagline {
        color: #9ca3af;
        font-size: 1.25rem;
        margin-bottom: 2.5rem;
        font-weight: 300;
      }
      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 2.5rem;
        max-width: 480px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      h3 {
        color: #a78bfa;
        font-size: 1.4rem;
        margin: 0 0 1rem 0;
        font-weight: 500;
      }
      p {
        color: #d1d5db;
        line-height: 1.6;
        margin: 0;
        font-size: 1rem;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #34d399;
        padding: 0.4rem 1rem;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 500;
        margin-top: 1.5rem;
      }
      .dot {
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
        margin-right: 8px;
        box-shadow: 0 0 8px #10b981;
        animation: pulse 2s infinite;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Octarine</h1>
      <div class="tagline">Plaintext-Native Knowledge Hub 🌌</div>
      <div class="card">
        <h3>Core Backend Engine Active</h3>
        <p>Phase 1 (Epic 1) is fully operational. The high-performance Markdown parser, SQLite caching system, and recursive directory file watcher are active and running in background threads.</p>
        <div class="status-pill">
          <span class="dot"></span>
          LOCAL CLIENT OPERATIONAL
        </div>
      </div>
    </div>
  </body>
</html>
