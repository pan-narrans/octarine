name: Draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tag must be annotated: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Release tag must point to a commit on master." >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          package_version="$(jq -r '.version' package.json)"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | jq -r '.packages[] | select(.name == "octarine") | .version')"

          for version in "$tauri_version" "$package_version" "$cargo_version"; do
            if [[ "$version" != "$tag_version" ]]; then
              echo "Tag version $tag_version does not match configured version $version." >&2
              exit 1
            fi
          done

          if [[ "$tag_version" == *-* ]]; then
            channel="beta"
          else
            channel="stable"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Validated Octarine $tag_version for $channel channel."

  quality:
    name: Release quality gate
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check generated IPC contracts
        run: npm run ipc:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-targets

  updater-artifacts:
    name: Signed updater (${{ matrix.label }})
    needs: [validate, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            distribution: direct
            bundles: dmg
          - label: Linux AppImage x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            distribution: appimage
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            xdg-utils

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build signed updater artifact
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCTARINE_DISTRIBUTION: ${{ matrix.distribution }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Octarine ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.channel == 'beta' }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          retryAttempts: 3
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
