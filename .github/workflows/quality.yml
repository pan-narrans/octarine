name: Quality

on:
  pull_request:
    branches: [master, "release/**"]
  push:
    branches: [master, "release/**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check generated IPC contracts
        run: npm run ipc:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm run test

      - name: Test updater manifest routing
        run: npm run test:updater-manifests

      - name: Test release configuration
        run: npm run test:release-config

      - name: Test release smoke-report validation
        run: npm run test:release-smoke

      - name: Test public-release verification
        run: npm run test:public-release

      - name: Fetch cross-platform Rust dependencies
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target x86_64-unknown-linux-gnu

      - name: Check third-party notices
        run: npm run licenses:check

      - name: Run visual regression suite
        run: npm run visual:test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-targets
