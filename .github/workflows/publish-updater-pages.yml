name: Publish updater manifests

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: updater-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish stable and beta manifests
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updater site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Build channel manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/updates
          cp update-site/index.html site/index.html

          download_manifest() {
            local tag="$1"
            local destination="$2"

            mkdir -p "$destination"
            gh release download "$tag" --pattern latest.json --dir "$destination"
            node .github/scripts/update-manifests.mjs validate "$destination/latest.json"
          }

          fetch_current_manifest() {
            local channel="$1"
            local destination="$2"
            local url="https://pan-narrans.github.io/octarine/updates/$channel.json?run=$GITHUB_RUN_ID"

            if curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" "$url" --output "$destination"; then
              node .github/scripts/update-manifests.mjs validate "$destination"
              return 0
            fi
            rm -f "$destination"
            return 1
          }

          download_manifest "$RELEASE_TAG" "$RUNNER_TEMP/release"
          manifest_channel="$(node .github/scripts/update-manifests.mjs channel "$RUNNER_TEMP/release/latest.json")"

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            if [[ "$manifest_channel" != "beta" ]]; then
              echo "GitHub prerelease flag does not match updater manifest version." >&2
              exit 1
            fi
            beta_args=(--beta "$RUNNER_TEMP/release/latest.json")
            if fetch_current_manifest stable "$RUNNER_TEMP/stable.json"; then
              cp "$RUNNER_TEMP/stable.json" site/updates/stable.json
              beta_args+=(--stable "$RUNNER_TEMP/stable.json")
            fi
            node .github/scripts/update-manifests.mjs select-beta \
              "${beta_args[@]}" --output site/updates/beta.json
          else
            gh release download "$RELEASE_TAG" --pattern smoke-report.json --dir "$RUNNER_TEMP/release"
            node .github/scripts/validate-smoke-report.mjs \
              "$RUNNER_TEMP/release/smoke-report.json" "$RELEASE_TAG"
            if [[ "$manifest_channel" != "stable" ]]; then
              echo "GitHub stable flag does not match updater manifest version." >&2
              exit 1
            fi
            cp "$RUNNER_TEMP/release/latest.json" site/updates/stable.json
            beta_args=(--stable "$RUNNER_TEMP/release/latest.json")
            if fetch_current_manifest beta "$RUNNER_TEMP/beta.json"; then
              beta_args+=(--beta "$RUNNER_TEMP/beta.json")
            fi
            node .github/scripts/update-manifests.mjs select-beta \
              "${beta_args[@]}" --output site/updates/beta.json
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify public source clone
        run: git clone --depth 1 https://github.com/pan-narrans/octarine.git "$RUNNER_TEMP/public-source"

      - name: Verify public updater channel
        env:
          CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
        run: node .github/scripts/verify-public-release.mjs --channel "$CHANNEL"
