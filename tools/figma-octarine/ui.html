<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octarine Local Design Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 20px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0 0 16px;
        color: var(--figma-color-text-secondary);
        font-size: 12px;
        line-height: 1.5;
      }

      .status {
        min-height: 104px;
        margin-bottom: 16px;
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .status[data-ok="true"] {
        border-color: var(--figma-color-border-success);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
      }

      button.secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <h1>Octarine Local Design Bridge</h1>
    <p>Runs through Figma Desktop's local Plugin API and does not consume MCP calls.</p>
    <div class="status" id="status" role="status" aria-live="polite">Connecting…</div>
    <div class="actions">
      <button class="primary" id="build">Build/update design</button>
      <button class="primary" id="inspect">Check connection</button>
      <button class="secondary" id="close">Close</button>
    </div>

    <script>
      const status = document.getElementById("status");
      const buildButton = document.getElementById("build");
      const inspectButton = document.getElementById("inspect");
      const closeButton = document.getElementById("close");
      const isInsideFigma = window.parent !== window;
      let responseTimer;

      const clearResponseTimer = () => {
        window.clearTimeout(responseTimer);
        responseTimer = undefined;
      };

      const expectResponse = (action) => {
        clearResponseTimer();
        responseTimer = window.setTimeout(() => {
          status.dataset.ok = "false";
          status.textContent =
            `${action} timed out.\n\n` +
            "Close this panel and reopen Octarine Local Design Bridge from Figma Desktop → Plugins → Development.";
        }, 10000);
      };

      if (!isInsideFigma) {
        status.dataset.ok = "false";
        status.textContent =
          "Not connected to Figma.\n\n" +
          "This file is the plugin panel, not a standalone web app. Open it from Figma Desktop → Plugins → Development → Octarine Local Design Bridge.";
        buildButton.disabled = true;
        inspectButton.disabled = true;
        closeButton.disabled = true;
      }

      buildButton.onclick = () => {
        status.dataset.ok = "false";
        status.textContent = "Preparing the component library…";
        expectResponse("Build");
        parent.postMessage({ pluginMessage: { type: "build-all" } }, "*");
      };

      inspectButton.onclick = () => {
        status.dataset.ok = "false";
        status.textContent = "Checking…";
        expectResponse("Connection check");
        parent.postMessage({ pluginMessage: { type: "inspect" } }, "*");
      };

      closeButton.onclick = () => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      };

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "build-progress") {
          clearResponseTimer();
          status.textContent = message.message;
          return;
        }

        if (message.type === "build-complete") {
          clearResponseTimer();
          status.dataset.ok = String(message.ok);
          if (!message.ok) {
            status.textContent = `Build failed\n${message.error}`;
            return;
          }
          const validation = message.result.validation;
          status.textContent =
            `Build complete\n${validation.componentCount} components · ${validation.instanceCount} instances\n` +
            `${validation.screens.join(", ")}\n` +
            `${validation.unnamedCount} unnamed · ${validation.wrongFontCount} wrong-font nodes`;
          return;
        }

        if (message.type !== "connection-status") return;

        clearResponseTimer();
        status.dataset.ok = String(message.ok);
        if (!message.ok) {
          status.textContent = `Connection failed\n${message.error}`;
          return;
        }

        const details = message.details;
        const pages = details.pages
          .map((page) => `${page.name}: ${page.childCount} top-level layer(s)`)
          .join("\n");
        const variables = details.variableCollections.reduce(
          (sum, collection) => sum + collection.variableCount,
          0,
        );
        status.textContent =
          `Connected to ${details.fileName}\n` +
          `${details.pages.length} pages · ${variables} variables\n\n${pages}`;
      };
    </script>
  </body>
</html>
